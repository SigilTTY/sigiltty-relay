# CI for sigiltty-relay: relay tests (Node 24 + pnpm), watcher tests, and
# watcher binaries for four targets — static musl for Linux (via cross),
# native slices for macOS — with a SHA256SUMS manifest (the bootstrap
# contract, docs/PROTOCOL.md §10). A v* tag additionally publishes the
# binaries + manifest as a GitHub release, which is the distribution
# channel the bootstrap curls from. Workers deploy is a later step — it
# needs Cloudflare secrets.

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  relay:
    name: relay (test + typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: relay
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: relay/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

  watcher-test:
    name: watcher (test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: watcher
      - run: cargo test
        working-directory: watcher

  watcher-build:
    name: watcher (${{ matrix.target }})
    needs: [watcher-test]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Linux: static musl via cross (docker). macOS: native cargo on
          # the arm64 runner — cross is linux-only, and rustup handles the
          # x86_64 slice as an ordinary added target.
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-latest, cross: true }
          - { target: x86_64-apple-darwin, os: macos-latest, cross: false }
          - { target: aarch64-apple-darwin, os: macos-latest, cross: false }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@v2
        if: ${{ matrix.cross }}
        with:
          tool: cross
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: watcher
          key: ${{ matrix.target }}
      - name: Build
        working-directory: watcher
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi
      - name: Stage binary under its release name
        run: |
          mkdir -p dist
          cp "watcher/target/${{ matrix.target }}/release/sigiltty-watcher" \
             "dist/sigiltty-watcher-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sigiltty-watcher-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  checksums:
    name: SHA256SUMS
    needs: [watcher-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: sigiltty-watcher-*
          path: dist
          merge-multiple: true
      - name: Build manifest
        run: |
          cd dist
          sha256sum sigiltty-watcher-* > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: watcher-release
          path: dist/*
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [relay, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: watcher-release
          path: dist
      - name: Create release with binaries + manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --notes "sigiltty-watcher binaries (linux musl static ×2, macOS native ×2) + SHA256SUMS — the bootstrap contract's distribution artifacts (docs/PROTOCOL.md §10)."
